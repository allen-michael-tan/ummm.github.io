<style>

    align-items:center;
    height:100vh;

.card{
    background:white;

h2{

}

.buttons{

}

button{
    background:#ff7fb5;
    color:white;
    border:none;
    padding:12px 24px;
    margin:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

button:hover{
    background:#ff5f9e;
    transform:scale(1.05);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
